<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15232e">
<title>스마트설비 데모</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%229%22%20fill%3D%22%23b4652f%22%2F%3E%3Cpath%20d%3D%22M9%2012h11a8%208%200%20018%208v11%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M9%209v6M25%2031h6%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M14%2026c0%202%201.3%203.3%203%203.3s3-1.3%203-3.3c0-1.6-3-5.3-3-5.3s-3%203.7-3%205.3z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E%0A">
<style>/* 스마트설비 — 배관 설비 업체 운영 콘솔
   레이아웃: PC는 짙은 강관색 사이드바 + 작업 영역, 휴대폰은 상단 바 + 하단 탭 바.
   색: 차가운 강철 회색 바탕, 물(수도) 청록 포인트, 동관(구리) 색은 진행 표시에만 사용. */

:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --surface-3: #e7ecf0;
  --line: #d8dfe5;
  --line-strong: #b9c4cd;
  --text: #16222c;
  --text-2: #4d5c69;
  --text-3: #7a8794;
  --brand: #0b6282;
  --brand-strong: #084b64;
  --brand-soft: #e1eff5;
  --on-brand: #ffffff;
  --copper: #b4652f;
  --copper-soft: #f6e8de;
  --nav-bg: #15232e;
  --nav-fg: #e8eef2;
  --nav-fg-2: #95a6b3;
  --nav-active: #213746;
  --crit: #c1352b;
  --crit-soft: #fbe8e5;
  --crit-line: #eeb3ab;
  --warn: #9a6100;
  --warn-soft: #fdf2d8;
  --warn-line: #ecd08e;
  --ok: #1d7446;
  --ok-soft: #e2f3e8;
  --info: #45598a;
  --info-soft: #e8ecf6;
  --crew-0: #0b7c8c;
  --crew-1: #7048b5;
  --crew-2: #b4652f;
  --crew-3: #3d7a2b;
  --shadow: 0 1px 2px rgba(20, 35, 46, 0.06), 0 4px 16px rgba(20, 35, 46, 0.06);
  --shadow-lg: 0 12px 40px rgba(12, 24, 33, 0.22);
  --focus: #1c8fc0;
  --backdrop: rgba(12, 22, 30, 0.5);

  --font-sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "D2Coding", Menlo, Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.875rem;
  --fs-lg: 1rem;
  --fs-xl: 1.25rem;
  --fs-2xl: 1.625rem;
  --radius: 10px;
  --radius-sm: 6px;
  --tabbar-h: 60px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171d;
    --surface: #17222a;
    --surface-2: #1c2932;
    --surface-3: #22313b;
    --line: #2b3a45;
    --line-strong: #3d505e;
    --text: #e6edf2;
    --text-2: #aab8c3;
    --text-3: #7f909d;
    --brand: #4fb3d9;
    --brand-strong: #7cc8e6;
    --brand-soft: #16323f;
    --on-brand: #06222e;
    --copper: #e08d55;
    --copper-soft: #3a2619;
    --nav-bg: #0b1217;
    --nav-fg: #e3eaef;
    --nav-fg-2: #8494a1;
    --nav-active: #1a2831;
    --crit: #ff7b6e;
    --crit-soft: #3a1c1a;
    --crit-line: #7a342d;
    --warn: #f0b64e;
    --warn-soft: #362a12;
    --warn-line: #6e5419;
    --ok: #5fcf8e;
    --ok-soft: #173424;
    --info: #9fb1e3;
    --info-soft: #1e2640;
    --crew-0: #3cc0cf;
    --crew-1: #a988e6;
    --crew-2: #e08d55;
    --crew-3: #7cc466;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
    --focus: #6cc6ea;
    --backdrop: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0f171d;
  --surface: #17222a;
  --surface-2: #1c2932;
  --surface-3: #22313b;
  --line: #2b3a45;
  --line-strong: #3d505e;
  --text: #e6edf2;
  --text-2: #aab8c3;
  --text-3: #7f909d;
  --brand: #4fb3d9;
  --brand-strong: #7cc8e6;
  --brand-soft: #16323f;
  --on-brand: #06222e;
  --copper: #e08d55;
  --copper-soft: #3a2619;
  --nav-bg: #0b1217;
  --nav-fg: #e3eaef;
  --nav-fg-2: #8494a1;
  --nav-active: #1a2831;
  --crit: #ff7b6e;
  --crit-soft: #3a1c1a;
  --crit-line: #7a342d;
  --warn: #f0b64e;
  --warn-soft: #362a12;
  --warn-line: #6e5419;
  --ok: #5fcf8e;
  --ok-soft: #173424;
  --info: #9fb1e3;
  --info-soft: #1e2640;
  --crew-0: #3cc0cf;
  --crew-1: #a988e6;
  --crew-2: #e08d55;
  --crew-3: #7cc466;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
  --focus: #6cc6ea;
  --backdrop: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ─── 기본 ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: 1.5;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font-size: var(--fs-xl); font-weight: 700; }
h2 { font-size: var(--fs-lg); font-weight: 700; }
h3 { font-size: var(--fs-md); font-weight: 700; }
p { margin: 0; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
svg.ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.alert > svg.ico { width: 20px; height: 20px; margin-top: 1px; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 0.92em; letter-spacing: -0.01em; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.strong { font-weight: 700; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

/* ─── 앱 틀 ────────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--nav-bg) 232px, transparent 232px); }
.sidebar {
  position: sticky; top: 0; height: 100vh;
  background: var(--nav-bg); color: var(--nav-fg);
  display: flex; flex-direction: column; gap: 4px; padding: 18px 12px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.02em; }
.brand-sub { font-size: var(--fs-xs); color: var(--nav-fg-2); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm);
  color: var(--nav-fg-2); font-weight: 600; text-decoration: none;
}
.nav a:hover { color: var(--nav-fg); background: var(--nav-active); }
.nav a[aria-current="page"] { color: var(--nav-fg); background: var(--nav-active); box-shadow: inset 3px 0 0 var(--copper); }
.nav .ico { width: 18px; height: 18px; flex: none; }
.nav .count {
  margin-left: auto; min-width: 22px; padding: 0 6px; border-radius: 99px; text-align: center;
  font-size: var(--fs-xs); font-weight: 700; background: var(--crit); color: #fff; font-variant-numeric: tabular-nums;
}
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px; font-size: var(--fs-xs); color: var(--nav-fg-2); }
.sidebar-foot select { background: var(--nav-active); color: var(--nav-fg); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 6px 8px; width: 100%; }

.main { min-width: 0; padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: none; }
.tabbar { display: none; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head .eyebrow { font-size: var(--fs-xs); font-weight: 700; color: var(--text-3); letter-spacing: 0.04em; }
.page-head h1 { font-size: var(--fs-2xl); letter-spacing: -0.02em; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ─── 버튼 ─────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn-danger { color: var(--crit); border-color: var(--crit-line); background: var(--surface); }
.btn-danger:hover { background: var(--crit-soft); }
.btn-warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--brand); }
.btn-ghost:hover { background: var(--brand-soft); }
.btn-sm { min-height: 30px; padding: 0 10px; font-size: var(--fs-sm); }
.btn-lg { min-height: 48px; padding: 0 20px; font-size: var(--fs-lg); }
.btn-block { width: 100%; }
.icon-btn { background: none; border: 0; padding: 6px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-2); display: inline-flex; }
.icon-btn:hover { background: var(--surface-3); }

/* ─── 칩·배지 ─────────────────────────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px;
  font-size: var(--fs-xs); font-weight: 700; line-height: 1.6; white-space: nowrap;
  background: var(--surface-3); color: var(--text-2);
}
.chip-brand { background: var(--brand-soft); color: var(--brand); }
.chip-copper { background: var(--copper-soft); color: var(--copper); }
.chip-ok { background: var(--ok-soft); color: var(--ok); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.chip-crit { background: var(--crit-soft); color: var(--crit); }
.chip-info { background: var(--info-soft); color: var(--info); }
.chip-outline { background: transparent; border: 1px solid var(--line-strong); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 800; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.sev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sev-critical { background: var(--crit-soft); color: var(--crit); }
.sev-warning { background: var(--warn-soft); color: var(--warn); }
.sev-info { background: var(--info-soft); color: var(--info); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* ─── 카드·패널 ───────────────────────────────────────── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.card-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.section-title { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.section-title h2 { font-size: var(--fs-lg); }
.empty { padding: 28px 16px; text-align: center; color: var(--text-3); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: var(--fs-md); }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; min-width: 0; }
.note { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-2); font-size: var(--fs-sm); }

/* 알림 띠 */
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid; font-size: var(--fs-md); }
.alert-critical { background: var(--crit-soft); border-color: var(--crit-line); color: var(--text); }
.alert-warning { background: var(--warn-soft); border-color: var(--warn-line); color: var(--text); }
.alert-info { background: var(--info-soft); border-color: transparent; color: var(--text); }
.alert-ok { background: var(--ok-soft); border-color: transparent; color: var(--text); }
.alert .alert-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.alert .alert-title { font-weight: 700; }

/* ─── 지표 ─────────────────────────────────────────────── */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .label { font-size: var(--fs-sm); color: var(--text-2); font-weight: 600; }
.kpi .value { font-size: var(--fs-xl); font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: var(--fs-xs); color: var(--text-3); }

/* 위험 4종 타일 */
.risk-hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 3fr); gap: 12px; }
.risk-total { background: var(--nav-bg); color: var(--nav-fg); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 6px; justify-content: space-between; }
.risk-total .label { font-size: var(--fs-sm); color: var(--nav-fg-2); font-weight: 600; }
.risk-total .value { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.risk-total .sub { font-size: var(--fs-sm); color: var(--nav-fg-2); }
.risk-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.risk {
  display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  color: var(--text); text-decoration: none; position: relative;
}
.risk:hover { text-decoration: none; border-color: var(--line-strong); }
.risk .r-label { font-size: var(--fs-sm); font-weight: 700; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.risk .r-count { font-size: 1.75rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.risk .r-count small { font-size: var(--fs-sm); font-weight: 600; color: var(--text-3); margin-left: 2px; }
.risk .r-sub { font-size: var(--fs-xs); color: var(--text-3); }
.risk.has-critical { border-color: var(--crit-line); box-shadow: inset 0 3px 0 var(--crit); }
.risk.has-warning { box-shadow: inset 0 3px 0 var(--warn); }
.risk.is-clear { box-shadow: inset 0 3px 0 var(--ok); }

/* ─── 흐름(스테퍼) ────────────────────────────────────── */
.stepper { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; counter-reset: step; }
.step { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-xs); color: var(--text-3); font-weight: 600; min-width: 0; }
.step .bar { height: 6px; border-radius: 3px; background: var(--surface-3); }
.step.done .bar { background: var(--copper); }
.step.done { color: var(--text-2); }
.step.current .bar { background: linear-gradient(90deg, var(--copper) 50%, var(--surface-3) 50%); }
.step.current { color: var(--text); font-weight: 800; }
.step.blocked .bar { background: var(--crit); }

.flow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; }
.flow a { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; color: var(--text); text-decoration: none; border-right: 1px solid var(--line); min-width: 0; }
.flow a:last-child { border-right: 0; }
.flow a:hover { background: var(--surface-2); }
.flow .f-label { font-size: var(--fs-xs); color: var(--text-3); font-weight: 700; }
.flow .f-count { font-size: var(--fs-xl); font-weight: 800; font-variant-numeric: tabular-nums; }
.flow .f-sub { font-size: var(--fs-xs); color: var(--text-2); }

/* ─── 탭 ──────────────────────────────────────────────── */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 10px 14px; color: var(--text-2); font-weight: 600; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.tabs .badge { min-width: 18px; padding: 0 5px; border-radius: 99px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 800; text-align: center; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips a, .chips button {
  padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--text-2); font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; cursor: pointer; text-decoration: none;
}
.chips [aria-pressed="true"], .chips [aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

/* ─── 표 ──────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-md); overflow-wrap: normal; }
.tbl th { text-align: left; font-size: var(--fs-xs); font-weight: 700; color: var(--text-3); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); }
.tbl tr.row-crit td { background: var(--crit-soft); }
.tbl tr.row-warn td { background: var(--warn-soft); }
.tbl tr.row-muted td { color: var(--text-3); }
.tbl tr.row-off td { color: var(--text-3); text-decoration: line-through; }
.tbl a.rowlink { color: var(--text); font-weight: 600; }

/* ─── 폼 ──────────────────────────────────────────────── */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

.field .hint { font-size: var(--fs-xs); color: var(--text-3); }
.input, input[type="text"], input[type="tel"], input[type="number"], input[type="date"], input[type="time"], input[type="datetime-local"], input[type="search"], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
}
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.fields-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); overflow: hidden; flex-wrap: wrap; }
.seg label { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: var(--fs-sm); border-right: 1px solid var(--line); }
.seg label:last-child { border-right: 0; }
.seg input { accent-color: var(--brand); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }
.form-error { color: var(--crit); font-weight: 600; font-size: var(--fs-sm); }

/* 견적 편집기 */
.items-editor { display: flex; flex-direction: column; gap: 8px; }
.item-row { display: grid; grid-template-columns: 84px minmax(0, 2.4fr) 76px 56px 110px 110px 34px; gap: 6px; align-items: center; }
.item-row.head { font-size: var(--fs-xs); color: var(--text-3); font-weight: 700; }
.item-row input, .item-row select { min-height: 36px; padding: 6px 8px; }
.item-row .amount { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.totals { display: grid; grid-template-columns: max-content max-content; gap: 4px 20px; justify-content: end; font-variant-numeric: tabular-nums; }
.totals dt { color: var(--text-2); }
.totals dd { margin: 0; text-align: right; }
.totals .grand { font-size: var(--fs-lg); font-weight: 800; color: var(--text); }
.items-summary { padding: 10px 12px 2px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }

/* ─── 파이프라인 보드 ─────────────────────────────────── */
.board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--surface-3); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 4px; font-weight: 700; font-size: var(--fs-sm); color: var(--text-2); }
.job-card {
  display: flex; flex-direction: column; gap: 6px; padding: 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); color: var(--text); text-decoration: none; min-width: 0;
}
.job-card:hover { border-color: var(--brand); text-decoration: none; }
.job-card.has-critical { border-left: 3px solid var(--crit); }
.job-card.has-warning { border-left: 3px solid var(--warn); }
.job-card .jc-top { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.job-card .jc-title { font-weight: 700; line-height: 1.35; }
.job-card .jc-meta { font-size: var(--fs-xs); color: var(--text-3); display: flex; gap: 6px; flex-wrap: wrap; }
.job-list { display: flex; flex-direction: column; gap: 8px; }

/* ─── 일정 ────────────────────────────────────────────── */
.day-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.day-nav .date { font-weight: 800; font-size: var(--fs-lg); min-width: 140px; text-align: center; }
.timeline { --hours: 13; --start: 7; display: grid; grid-template-columns: 150px minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tl-scale { position: relative; height: 28px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.tl-scale span { position: absolute; top: 6px; font-size: var(--fs-xs); color: var(--text-3); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.tl-scale span:first-child { transform: none; padding-left: 4px; }
.tl-scale span:last-child { transform: translateX(-100%); padding-right: 4px; }
.tl-corner { border-bottom: 1px solid var(--line); background: var(--surface-2); border-right: 1px solid var(--line); }
.tl-crew { padding: 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.tl-crew .n { font-weight: 800; display: flex; align-items: center; gap: 6px; }
.tl-crew .m { font-size: var(--fs-xs); color: var(--text-3); }
.tl-lane { position: relative; border-bottom: 1px solid var(--line); min-height: 64px; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc(100% / var(--hours)) 100%; }
.timeline > :nth-last-child(-n+2) { border-bottom: 0; }
.tl-block {
  position: absolute; top: 6px; height: 50px; border-radius: 6px; padding: 5px 8px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--crew, var(--brand)); box-shadow: inset 4px 0 0 var(--crew, var(--brand));
  color: var(--text); text-decoration: none; font-size: var(--fs-xs); line-height: 1.35; display: flex; flex-direction: column;
}
.tl-block:hover { text-decoration: none; z-index: 3; box-shadow: inset 4px 0 0 var(--crew), var(--shadow-lg); }
.tl-block .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-block .s { color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tl-block.survey { border-style: dashed; }
.tl-block.done { opacity: 0.55; }
.tl-block.conflict { background: var(--crit-soft); border-color: var(--crit); box-shadow: inset 4px 0 0 var(--crit); }
.tl-block.warn { background: var(--warn-soft); }
.tl-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--crit); z-index: 2; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 10px; border-radius: 3px; border: 1.5px solid var(--brand); display: inline-block; }
.agenda { display: flex; flex-direction: column; gap: 8px; }
.agenda-item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--text); text-decoration: none; box-shadow: inset 4px 0 0 var(--crew, var(--brand)); }
.agenda-item:hover { text-decoration: none; border-color: var(--line-strong); }
.agenda-item.conflict { background: var(--crit-soft); border-color: var(--crit-line); box-shadow: inset 4px 0 0 var(--crit); }
.agenda-item .time { font-weight: 800; font-variant-numeric: tabular-nums; font-size: var(--fs-sm); }
.agenda-item .time small { display: block; color: var(--text-3); font-weight: 600; }
.week { display: grid; grid-template-columns: 90px repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.week > div { padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; font-size: var(--fs-xs); }
.week .wh { background: var(--surface-2); font-weight: 700; color: var(--text-2); text-align: center; }
.week .wh.today { color: var(--brand); }
.week .wc { font-weight: 800; background: var(--surface-2); }
.week .cell { display: flex; flex-direction: column; gap: 4px; }
.week .pill { display: block; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); border-left: 3px solid var(--crew, var(--brand)); color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.week .pill.conflict { background: var(--crit-soft); border-left-color: var(--crit); }

/* ─── 점검 항목 ───────────────────────────────────────── */
.finding { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.finding:last-child { border-bottom: 0; }
.finding .f-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.finding .f-title { font-weight: 700; }
.finding .f-detail { color: var(--text-2); font-size: var(--fs-sm); }
.finding .f-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.finding .f-amount { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.finding.acked { opacity: 0.6; }
.finding .f-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* 이력 */
.timeline-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline-list li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: var(--fs-sm); }
.timeline-list li:last-child { border-bottom: 0; }
.timeline-list .when { color: var(--text-3); font-variant-numeric: tabular-nums; }
.timeline-list li.warn .what { color: var(--warn); font-weight: 600; }

/* 서명 */
.sigpad { position: relative; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); touch-action: none; user-select: none; -webkit-user-select: none; }
.sigpad canvas { display: block; width: 100%; height: 160px; cursor: crosshair; }
.sigpad .sig-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none; font-size: var(--fs-sm); }
.sigpad.signed .sig-hint { display: none; }
.sig-img { max-height: 60px; background: #fff; border-radius: 4px; border: 1px solid var(--line); padding: 2px; }

/* ─── 모달·토스트 ─────────────────────────────────────── */
.modal-backdrop { position: fixed; inset: 0; background: var(--backdrop); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.modal.wide { width: min(760px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); }
.toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(420px, calc(100vw - 32px)); }
.toast { padding: 12px 14px; border-radius: var(--radius-sm); background: var(--nav-bg); color: var(--nav-fg); box-shadow: var(--shadow-lg); font-size: var(--fs-sm); display: flex; gap: 8px; align-items: flex-start; animation: toast-in 0.18s ease-out; }
.toast.warn { background: var(--warn-soft); color: var(--text); border: 1px solid var(--warn-line); }
.toast.error { background: var(--crit-soft); color: var(--text); border: 1px solid var(--crit-line); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }

/* ─── 고객용 문서 화면 ────────────────────────────────── */
.doc-page { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.doc-head { padding: 20px; border-bottom: 3px double var(--line-strong); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.doc-head .doc-type { font-size: var(--fs-2xl); font-weight: 800; letter-spacing: 0.2em; }
.doc-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.doc-total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; background: var(--brand-soft); border-radius: var(--radius-sm); }
.doc-total .v { font-size: var(--fs-xl); font-weight: 800; font-variant-numeric: tabular-nums; }

.cust-mode:has(input[value="new"]:checked) .existing-fields { display: none; }
.cust-mode:has(input[value="existing"]:checked) .new-fields { display: none; }
.approve-form:not(:has(input[value="현장 서명"]:checked)) .sig-area { display: none; }

  .risk-hero { grid-template-columns: 1fr; }

  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

  .item-row.head { display: none; }
  .item-row .c-kind { grid-area: kind; }
  .item-row .c-name { grid-area: name; }
  .item-row .c-qty { grid-area: qty; }
  .item-row .c-unit { display: none; }
  .item-row .c-price { grid-area: price; }
  .item-row .amount { grid-area: amount; display: none; }
  .item-row .c-del { grid-area: del; }
  .finding { grid-template-columns: 1fr; }
  .finding .f-side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; justify-content: space-between; width: 100%; }
  .timeline-list li { grid-template-columns: 1fr; gap: 2px; }

  }
}
@media (min-width: 861px) {
  .only-mobile { display: none !important; }
  .fab { display: none; }
}
@media (prefers-reduced-motion: reduce) {

}
